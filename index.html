<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Mainstream Order</title>
</head>
<body>
    <h1>Track Your Mainstream Order</h1>
    <input type="text" id="trackingNumber" placeholder="Enter Tracking Number">
    <button onclick="trackOrder()">Track</button>

    <div id="result"></div>

    <script>
        function trackOrder() {
            // Get the tracking number entered by the user
            const trackingNumber = document.getElementById("trackingNumber").value;

            if (trackingNumber) {
                // Replace the {0} placeholder in the URL with the tracking number
                const trackingUrl = `https://yessirman1.github.io/mainstream-tracking/?trackingNumber=${trackingNumber}`;

                // Create an iframe to load Mainstream's tracking page with the tracking number
                const iframe = document.createElement("iframe");
                iframe.src = trackingUrl; // URL with tracking number passed as query parameter
                iframe.style.width = "100%";
                iframe.style.height = "600px";
                
                // Clear any previous results and append the iframe
                document.getElementById("result").innerHTML = ""; 
                document.body.appendChild(iframe);
            } else {
                alert("Please enter a tracking number.");
            }
        }
    </script>
</body>
</html>
