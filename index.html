<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Mainstream Order</title>
</head>
<body>
    <h1>Track Your Mainstream Order</h1>

    <script>
        // Function to load the tracking page
        function loadTrackingPage(trackingNumber) {
            if (trackingNumber) {
                // Create an iframe and set the src to the Mainstream tracking page
                const iframe = document.createElement("iframe");
                iframe.src = `https://www.mainstream.co.nz/?jobId=${trackingNumber}`;  // Use tracking number in the URL
                iframe.style.width = "100%";
                iframe.style.height = "600px";
                
                // Clear any previous content and append the iframe
                document.body.innerHTML = ''; // Clear the body content (removes the input and button)
                document.body.appendChild(iframe);
            } else {
                alert("Tracking number not found.");
            }
        }

        // Extract tracking number from the URL (WMS will pass it as part of the URL query)
        const urlParams = new URLSearchParams(window.location.search);
        const trackingNumber = urlParams.get('trackingNumber');

        // Call the function to load the tracking page if trackingNumber is found in the URL
        if (trackingNumber) {
            loadTrackingPage(trackingNumber);
        }
    </script>
</body>
</html>
