<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainstream Tracking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .loading {
      display: none;
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Mainstream Tracking</h1>
  <p>Tracking order number: <span id="tracking-number"></span></p>
  <p class="loading" id="loading">Redirecting to Mainstream...</p>
  <script>
    // Function to extract query parameters from URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Main function for Mainstream tracking automation
    function trackOrder() {
      const trackingNumber = getQueryParam('number'); // Get tracking number from URL
      const trackingNumberElement = document.getElementById('tracking-number');
      const loadingIndicator = document.getElementById('loading');

      if (!trackingNumber) {
        trackingNumberElement.textContent = "No tracking number provided.";
        return;
      }

      trackingNumberElement.textContent = trackingNumber;
      loadingIndicator.style.display = 'block';

      // Open Mainstream homepage
      const mainstreamUrl = "https://www.mainstream.co.nz";
      const newWindow = window.open(mainstreamUrl, "_blank");

      if (newWindow) {
        // Automate input and button click after the page loads
        const automationScript = `
          document.querySelector("input[name='trackingNumber']").value = "${trackingNumber}";
          document.querySelector("button[type='submit']").click();
        `;

        // Execute the script on the new page
        newWindow.onload = () => {
          newWindow.eval(automationScript);
        };
      } else {
        alert("Popup blocked! Please allow pop-ups for this site.");
      }
    }

    // Run the function on page load
    trackOrder();
  </script>
</body>
</html>
