<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainstream Tracking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .loading {
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Mainstream Tracking</h1>
  <p>Tracking order number: <span id="tracking-number"></span></p>
  <p class="loading" id="loading">Redirecting to Mainstream and searching...</p>
  <script>
    // Function to extract query parameters from URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Main function for Mainstream tracking automation
    function trackOrder() {
      const trackingNumber = getQueryParam('number'); // Get tracking number from URL
      const trackingNumberElement = document.getElementById('tracking-number');
      const loadingIndicator = document.getElementById('loading');

      if (!trackingNumber) {
        trackingNumberElement.textContent = "No tracking number provided.";
        return;
      }

      trackingNumberElement.textContent = trackingNumber;

      // Redirect to Mainstream's website
      const mainstreamUrl = "https://www.mainstream.co.nz";
      loadingIndicator.textContent = "Redirecting to Mainstream and entering tracking number...";

      // Redirect and automate input after page load
      window.location.href = mainstreamUrl;
      window.onload = () => {
        // Automate entering tracking number and clicking track
        const automationScript = `
          (function() {
            const inputField = document.querySelector("input[name='jobId']");
            const trackButton = document.querySelector("button.input-group-button");

            if (inputField) {
              inputField.value = "${trackingNumber}";
              if (trackButton) {
                trackButton.click();
              } else {
                console.error("Track button not found!");
              }
            } else {
              console.error("Input field not found!");
            }
          })();
        `;
        document.body.appendChild(
          Object.assign(document.createElement('script'), { text: automationScript })
        );
      };
    }

    // Run the function on page load
    trackOrder();
  </script>
</body>
</html>
